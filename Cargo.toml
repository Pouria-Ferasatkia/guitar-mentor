[package]
name = "guitar_mentor"
version = "0.1.0"
edition = "2021"
description = "Offline guitar tuner + chord teacher + rock song library for macOS (Apple Silicon ready)"
authors = ["Pouria"]
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = true, features = ["default_fonts", "glow"] }
egui = "0.29"
cpal = "0.15"
rustfft = "6.2"
realfft = "3.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
